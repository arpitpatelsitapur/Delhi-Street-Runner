<!DOCTYPE html>

</head>

  <div id="cr">created by github@arpitpatelsitapur</div>
  <script>
    let W = 900, H = 420, G = 340;
    const $ = i => document.getElementById(i), cv = $('c'), X = cv.getContext('2d'), SL = 640, PI = Math.PI, dpr0 = window.devicePixelRatio || 1;

    function chakra(x, y, r, c) { X.strokeStyle = c; X.lineWidth = 1; X.beginPath(); X.arc(x, y, r, 0, 7); for (let i = 0; i < 24; i++) { const a = i * PI / 12; X.moveTo(x, y); X.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) } X.stroke() }

    /* ---------- Audio (Web Audio, 8-bit) ---------- */
    let AC, mute = false;
    function snd(f, t, type = 'square', v = .15, f2, at = 0) { if (mute) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state == 'suspended') AC.resume(); const n = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, n); if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + t); g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.001, n + t); o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n + t) } catch (e) { } }
    const sJump = () => snd(260, .16, 'square', .14, 620), sOver = () => { snd(180, .6, 'sawtooth', .2, 40); snd(90, .6, 'square', .14, 30) }, sMile = () => { snd(880, .08); snd(1320, .14, 'square', .12, 0, .09) };

    /* ---------- State ---------- */
    let st = 'ready', sp = 6, dist = 0, sc = 0, hi = 0, tt = 0, ph = 0, obs = [], gap = 500, sd = 0, shake = 0, mile = 0, dk = false, cpx = 55, why = '', ot = 0, curM = -1, nb = false, shown = true;
    const P = { x: 220, y: G, vy: 0, duck: false };
    try { hi = +localStorage.getItem('dsr_hi') || 0 } catch (e) { }
    const MN = ['Red Fort (Lal Qila)', 'Qutub Minar', 'India Gate', 'Parliament (Sansad Bhavan)', 'Supreme Court of India', 'Jama Masjid', 'Rashtrapati Bhavan'];
    const WHY = { barricade: 'You crashed into a Delhi Police barricade!', cone: 'You tripped over a traffic cone!', block: 'You slammed into a stone road block!', drone: 'A surveillance drone spotted you. You needed to duck!' };

    function reset() { sp = 6; dist = 0; sc = 0; obs = []; gap = 500; sd = 0; shake = 0; mile = 0; P.y = G; P.vy = 0; P.duck = false; cpx = 55 }
    function start() { reset(); st = 'run'; $('ov').classList.add('h'); snd(440, .06, 'square', .1, 880) }
    function jump() { if (st == 'ready') return start(); if (st == 'over') { if (performance.now() - ot > 600) start(); return } if (P.y >= G) { P.vy = -14.5; sJump() } }
    function show() { const o = st == 'over'; $('t').textContent = o ? 'Caught by the Police!' : 'Delhi Street Runner'; $('m').textContent = o ? why : 'Run to save the Democracy! Carry the Tiranga high, outrun the Delhi Police, and dodge barricades, cones, road blocks and surveillance drones.'; $('d').innerHTML = o ? 'Distance covered: <b>' + (sc | 0) + ' m</b> · Best: <b>' + hi + ' m</b>' + (nb ? '<br>🏆 New record!' : '') : 'Space / ↑ to jump · ↓ to duck<br>or use the on-screen buttons'; $('go').textContent = o ? 'Run Again' : 'Start Running'; $('ov').classList.remove('h') }
    function die(o) { st = 'over'; why = WHY[o.t]; ot = performance.now(); shake = 14; sOver(); nb = sc > hi; if (nb) { hi = sc | 0; try { localStorage.setItem('dsr_hi', hi) } catch (e) { } } shown = false }
    function spawn() {
      const x = W + 60;
      if (sc > 120 && Math.random() < .3) obs.push({ t: 'drone', x, w: 52, h: 26, y: G - 78 });
      else {
        const q = Math.random(), T = q < .4 ? ['barricade', 66, 54] : q < .7 ? ['cone', 24, 38] : ['block', 46, 36]; obs.push({ t: T[0], x, w: T[1], h: T[2], y: G - T[2] });

      }
    }

    /* ---------- Update ---------- */
    function upd(k) {

        sp = Math.min(16 * Math.min(1, (W - P.x) / 680), 6 + sc / 140); sc = dist / 15;

        const bx = P.x - 10, by = P.y - (P.duck ? 42 : 72);

          o.x -= (sp + (o.t == 'drone' ? 2.5 : 0)) * k;
          if (st == 'run' && bx < o.x + o.w - 5 && bx + 20 > o.x + 5 && by < o.y + o.h - 4 && P.y > o.y + 4) die(o)
        }
        obs = obs.filter(o => o.x > -120); cpx = 55 + Math.sin(tt * .05) * 6;
        const m = Math.floor(sc / 100); if (m > mile) { mile = m; sMile(); const e = $('sc'); e.classList.remove('p'); void e.offsetWidth; e.classList.add('p') }
      } else if (st == 'over') { cpx = Math.min(cpx + 6 * k, P.x - 48); shake *= .9; if (!shown && performance.now() - ot > 650) { shown = true; show() } }
    }

    /* ---------- Characters ---------- */
    function human(x, y, p, pose, c) {
      const dc = pose == 'duck', air = pose == 'jump', hy = dc ? y - 15 : y - 34, ln = dc ? -9 : 3, tl = dc ? 17 : 26;
      X.lineCap = 'round'; X.lineJoin = 'round';
      for (let i = 0; i < 2; i++) {
        let a, b; const f = p + i * PI;
        if (dc) { a = 1.35 - i * .15; b = a + .1 } else if (air) { a = i ? -.5 : .9; b = i ? -1.5 : .6 } else { a = Math.sin(f) * .8; b = a - .1 - Math.max(0, Math.cos(f)) }

        X.strokeStyle = i ? c.q : c.p; X.lineWidth = 9; X.beginPath(); X.moveTo(x, hy); X.lineTo(kx, ky); X.lineTo(fx, fy); X.stroke();
        X.fillStyle = c.sh; X.beginPath(); X.ellipse(fx + 4, fy + 1, 7, 3.5, 0, 0, 7); X.fill()
      }
      const sx = x + ln, sy = hy - tl;
      X.strokeStyle = c.s; X.lineWidth = 14; X.beginPath(); X.moveTo(x, hy); X.lineTo(sx, sy); X.stroke();
      X.strokeStyle = c.bt; X.beginPath(); X.moveTo(x, hy); X.lineTo(x + (sx - x) * .16, hy + (sy - hy) * .16); X.stroke();
      const hx = sx + (dc ? -3 : 2), hz = sy - 9; C(hx, hz, 7.5, c.skin);
      if (c.hat) { X.fillStyle = c.hat; X.beginPath(); X.ellipse(hx + 1, hz - 5, 10, 5, -.15, 0, 7); X.fill(); C(hx + 5, hz - 5, 1.8, '#f5c542') }
      else { X.fillStyle = '#1b1b1b'; X.beginPath(); X.arc(hx, hz, 8, PI * .95, PI * 2.05); X.fill() }
      C(hx + 3, hz + 1, 1.2, '#222');
      return { sx, sy }
    }
    function flag(x, y) {
      const fy = y - 86, w = 58, h = 38, wv = i => Math.sin(i * .17 - tt * .3) * 4.5 * (i / w + .1);
      X.strokeStyle = '#d8b256'; X.lineWidth = 3; X.beginPath(); X.moveTo(x, y); X.lineTo(x, fy - 2); X.stroke(); C(x, fy - 3, 3, '#f3d36a');
      for (let i = 0; i < w; i += 2) { const o = wv(i); R(x + i, fy + o, 2.6, h / 3 + .6, '#ff9933'); R(x + i, fy + o + h / 3, 2.6, h / 3 + .6, '#fff'); R(x + i, fy + o + 2 * h / 3, 2.6, h / 3 + .6, '#138808') }
      chakra(x + w / 2, fy + h / 2 + wv(w / 2), 5.2, '#000080')
    }
    function drawPlayer() {
      const pose = P.y < G - 2 ? 'jump' : P.duck ? 'duck' : 'run', c = { p: '#2f63b8', q: '#244f96', s: '#20232f', sh: '#f2f2f2', skin: '#d9a273', bt: '#111' };
      const h = human(P.x, P.y, ph, pose, c);
      X.lineWidth = 6; X.strokeStyle = c.s; X.beginPath(); X.moveTo(h.sx, h.sy); X.lineTo(h.sx - 5 + Math.sin(ph) * 9, h.sy + 16); X.stroke();
      const ax = h.sx + 11, ay = h.sy - 9; X.beginPath(); X.moveTo(h.sx, h.sy); X.lineTo(ax, ay); X.stroke(); C(ax, ay, 3.5, c.skin);
      flag(ax, ay + 12)
    }
    function drawCop() {
      const c = { p: '#a98f58', q: '#8f7745', s: '#c4a96a', sh: '#111', skin: '#c68b5e', bt: '#2a2a2a', hat: '#1b2a5c' }, cp = ph * .92 + 1, h = human(cpx, G, cp, 'run', c);
      X.lineWidth = 6; X.strokeStyle = c.s; X.beginPath(); X.moveTo(h.sx, h.sy); X.lineTo(h.sx - 6 + Math.sin(cp) * 10, h.sy + 16); X.stroke();
      const ax = h.sx + 12, ay = h.sy + 4 + Math.sin(cp * 2) * 3; X.beginPath(); X.moveTo(h.sx, h.sy); X.lineTo(ax, ay); X.stroke(); C(ax, ay, 3.5, c.skin);
      const an = -1 + Math.sin(cp * 2) * .45; X.strokeStyle = '#6a3d17'; X.lineWidth = 5; X.beginPath(); X.moveTo(ax, ay); X.lineTo(ax + Math.cos(an) * 40, ay + Math.sin(an) * 40); X.stroke();
      R(h.sx - 6, h.sy + 3, 4, 3, '#f5c542')
    }

    /* ---------- Obstacles ---------- */
    function drawObs(o) {
      const { x, y, w, h } = o;
      if (o.t == 'barricade') {
        X.strokeStyle = '#14214f'; X.lineWidth = 4; X.beginPath(); X.moveTo(x + 8, y + h); X.lineTo(x + 14, y + 26); X.moveTo(x + w - 8, y + h); X.lineTo(x + w - 14, y + 26); X.stroke();
        R(x, y, w, 30, '#f6c500'); X.save(); X.beginPath(); X.rect(x, y, w, 30); X.clip(); X.strokeStyle = '#14214f'; X.lineWidth = 2; X.beginPath();
        for (let i = -30; i < w + 30; i += 10) { X.moveTo(x + i, y); X.lineTo(x + i + 30, y + 30); X.moveTo(x + i + 30, y); X.lineTo(x + i, y + 30) } X.stroke(); X.restore();
        R(x + 2, y + 9, w - 4, 12, '#14214f'); X.fillStyle = '#ffd400'; X.font = 'bold 7.5px Arial,sans-serif'; X.textAlign = 'center'; X.fillText('DELHI POLICE', x + w / 2, y + 18);
        X.strokeStyle = '#14214f'; X.lineWidth = 2; X.strokeRect(x, y, w, 30)
      }
      else if (o.t == 'cone') { const m = x + w / 2; R(x - 2, y + h - 5, w + 4, 5, '#222'); Pg('#ff6a13', x + 3, y + h - 5, x + w - 3, y + h - 5, m + 3, y, m - 3, y); Pg('#fff', m - 5.4, y + 13, m + 5.4, y + 13, m + 7.2, y + 22, m - 7.2, y + 22) }
      else if (o.t == 'block') {
        Pg('#8d8f94', x, y + h, x + 4, y + 8, x + 14, y, x + w - 12, y + 2, x + w, y + 12, x + w - 3, y + h); R(x + 8, y + 5, w - 22, 3, '#a9abb0');
        X.strokeStyle = '#5d5f64'; X.lineWidth = 1.5; X.beginPath(); X.moveTo(x + 12, y + 10); X.lineTo(x + 20, y + 20); X.lineTo(x + 16, y + h - 2); X.moveTo(x + 32, y + h); X.lineTo(x + 36, y + 14); X.stroke()
      }

        X.strokeStyle = '#1c1f28'; X.lineWidth = 3; X.beginPath(); X.moveTo(m - 20, cy - 6); X.lineTo(m - 6, cy - 1); X.moveTo(m + 20, cy - 6); X.lineTo(m + 6, cy - 1); X.stroke();

      }
    }

    /* ---------- Delhi monuments (x = centre, b = base) ---------- */
    const MF = [
      (x, b) => {
        const c = '#a4412c', e = '#8c3322', h = '#c25a3f'; R(x - 190, b - 72, 380, 72, c); for (let i = 0; i < 38; i++)R(x - 190 + i * 10, b - 80, 6, 8, c);
        R(x - 196, b - 96, 16, 96, e); R(x + 180, b - 96, 16, 96, e); D(x - 188, b - 96, 10, h); D(x + 188, b - 96, 10, h);
        R(x - 52, b - 124, 104, 124, e); for (let i = 0; i < 10; i++)R(x - 52 + i * 10.5, b - 132, 6, 8, e);

        for (const s of [-168, -130, -92, 92, 130, 168]) A(x + s, b - 44, 20, 44, '#5a2016'); A(x, b - 70, 34, 70, '#35120c')
      },
      (x, b) => {
